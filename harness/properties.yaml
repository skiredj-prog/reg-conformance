# Candidate property families: a reading aid for harness runs.
#
# NOT part of the frozen RFCs. Not ratified. Open to revision.
#
# Every check the index knows (a row of VECTORS.md) and every effect probe the
# harness runs is attached to the one family whose property it exercises most
# directly. The attachment changes no vector, no status and no tally: the
# vector summary of a run is computed exactly as before. The property view
# is a second reading of the same results.
#
# A property check (PX-<row>) is not listed here: it is counted under the
# family of the row it exercises.
#
# EGP = execution-governance property. The identifiers are provisional.
schema: reg-property-families/0
status: candidate
basis: >-
  Families follow the three dimensions of RFC-0 §4 (Standing, Structure,
  Commit) plus evidence. EGP-13 and EGP-14 restate properties of the frozen
  RFC-2 (§2.5, §2.8, §3.3, §3.4) and RFC-0 §4.

families:
  EGP-01: {dimension: standing,  title: "Valid authority for every effect"}
  EGP-11: {dimension: standing,  title: "Authority closure, in-flight work included"}
  EGP-04: {dimension: structure, title: "Shared constraints hold under concurrency"}
  EGP-13: {dimension: structure, title: "Degraded evidence never widens what is admitted"}
  EGP-14: {dimension: structure, title: "Admissibility is distinct from authorization"}
  EGP-02: {dimension: commit,    title: "The effect conforms to what was authorized"}
  EGP-03: {dimension: commit,    title: "Validity holds until the effect, at the declared bound"}
  EGP-05: {dimension: commit,    title: "A replay produces no additional effect"}
  EGP-06: {dimension: commit,    title: "A refusal or a suspension produces no governed effect"}
  EGP-09: {dimension: commit,    title: "Recovery without forbidden repetition"}
  EGP-10: {dimension: commit,    title: "Uncertainty about the effect is preserved"}
  EGP-12: {dimension: commit,    title: "Progress under declared conditions"}
  EGP-07: {dimension: evidence,  title: "The justification is auditable and reproducible"}
  EGP-08: {dimension: evidence,  title: "The history is tamper-evident"}

# Outside the candidate core: bound to a model, a wire binding or a scope, or
# about the claim rather than about the runtime.
groups:
  PROFILE-S:          {title: "Structural model S (profile)"}
  PROFILE-WIRE:       {title: "HTTP wire binding (profile)"}
  PROFILE-DELEGATION: {title: "Delegation (profile)"}
  PROFILE-OVERRIDE:   {title: "Emergency override (profile)"}
  CLAIMS:             {title: "Rules about the claim and the report"}

