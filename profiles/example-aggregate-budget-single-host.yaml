# Profil mono-hôte (file-lock + registre local). Configuration limitée à ce qui
# est implémenté et testé dans tenir_governance (registre durable fcntl.flock).
# Les preuves ci-dessous sont des sorties réelles de tests (voir evidence/).
# Une capacité reste NON attestée : cap.host.single-host exige un deployment.manifest
# décrivant un déploiement réel, que ce dépôt ne peut pas produire.

profile_id: "aggregate-budget-single-host"
profile_version: "1.0.0"
description: >
  Agrégation de budget sur un seul hôte, plusieurs processus. Déduplication par
  registre local (fichier), réservations sérialisées par fcntl.flock.
  UNKNOWN : fail-closed.

config:
  HOST_SCOPE: "mono-host"
  DEDUP_LAYER: "local-registry"
  CONCURRENCY: "file-lock"
  UNCERTAINTY: "fail-closed"

invariants:
  - "commit-binding"
  - "budget-ceiling-aggregate"
  - "single-dispatch-per-reservation"

attestations:
