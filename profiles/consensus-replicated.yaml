profile_id: consensus-replicated
profile_version: 1.1.0
description: 'Consensus distribué répliqué via Raft (pysyncobj) sur cluster loopback
  mono-hôte. Déduplication par registre répliqué, réservations atomiques par consensus,
  UNKNOWN fail-closed. Backend : RaftConsensusBackend (tenir_governance 5.6.0). Satisfait
  SAF, LIV, BUD sur loopback. FT crash-stop testée sur loopback uniquement. Déploiement
  multi-hôte physique non supporté avant 5.8.0 (FM-20 ouvert).

  '
config:
  HOST_SCOPE: mono-host
  DEDUP_LAYER: distributed-consensus-registry
  CONCURRENCY: distributed-consensus
  UNCERTAINTY: fail-closed
  network_scope: loopback-cluster
  host_scope_note: 'FM-20: raft_backend.py enforces single-host loopback in v5.7;
    multi-host physical deployment prohibited until 5.8.0'
fault_model:
  crash: 1
  byzantine: 0
  omission: 0
  quorum: 2
  total_nodes: 3
invariants:
- commit-binding
- budget-ceiling-aggregate
- single-dispatch-per-reservation
- linearizability
- agreement
adapter:
  required: true
  interface_version: 1.0.0
  backend_type: RaftConsensusBackend
  backend_version: 5.6.0
  backend_library: pysyncobj 0.3.17
  consensus_algorithm: Raft
  replication: state machine replication via @replicated commands
  determinism: reservation IDs generated client-side (not inside @replicated)
attestations:
- capability_ids:
  - cap.concurrency.consensus
  - cap.dedup.consensus-registry
  evidence_type: test.consensus.safety
  evidence_ref: evidence/test-raft-consensus-safety.log
  evidence_sha256: ab7dcd44028fec905218dde99fd75a99701050d6116edea4836498b0cbbeb3c6
  verified: true
  verifier: sandbox-run tenir_governance@334109f (auteur, non indépendant)
  verified_at: '2026-10-19'
  description: '19 tests : multi-node reserve/commit/release (10), BUD invariant (5),
    linearizability via Wing-Gong (4). Opérations depuis leader et followers. Format
    conforme à evidence-type-specs-v1.md §6.

    '
- capability_ids:
  - cap.concurrency.consensus
  - cap.dedup.consensus-registry
  evidence_type: test.consensus.liveness
  evidence_ref: evidence/test-raft-consensus-liveness.log
  evidence_sha256: c2d30460769e25416dc66051a4bf66631e3cc8f9042ef9e8c43be47a62b70f64
  verified: true
  verifier: sandbox-run tenir_governance@334109f (auteur, non indépendant)
  verified_at: '2026-10-19'
  description: '4 tests : terminaison sous quorum, depuis tous les nœuds, concurrent,
    sous défaillance minoritaire (5-nœuds, 1 crashé). Format conforme à evidence-type-specs-v1.md
    §7.

    '
- capability_ids:
  - cap.concurrency.consensus
  - cap.dedup.consensus-registry
  evidence_type: test.fault-tolerance
  evidence_ref: evidence/test-raft-fault-tolerance.log
  evidence_sha256: 4bbafbff6f56c41af2a743cd3d9a4cac0e4b96893ddc92046d01e687851ddddf
  verified: true
  verifier: sandbox-run tenir_governance@334109f (auteur, non indépendant)
  verified_at: '2026-10-19'
  description: '5 tests : élection de leader, failover après crash (3-nœuds et 5-nœuds),
    un seul leader, préservation d''état après failover. FT (tolérance aux pannes
    cross-host) attestée pour modèle crash-stop. Format conforme à evidence-type-specs-v1.md
    §8.

    '
- capability_ids:
  - cap.dedup.consensus-registry
  evidence_type: test.idempotency.distributed
  evidence_ref: evidence/test-raft-idempotency-distributed.log
  evidence_sha256: aa62639e7ff316d951529f6b04eac5a152ec5629acafba2ccb3c30f220137209
  verified: true
  verifier: sandbox-run tenir_governance@334109f (auteur, non indépendant)
  verified_at: '2026-10-19'
  description: '2 tests : idempotent re-reserve with same key+amount returns same
    reservation_id across nodes; different amount returns DUPLICATE_KEY. Format conforme
    à evidence-type-specs-v1.md §3.

    '
- capability_ids:
  - cap.host.single-host
  evidence_type: test.cross-host.communication
  evidence_ref: evidence/test-raft-cross-host-communication.log
  evidence_sha256: bb428af73edd4ea1b0d3890bbf0dc3c6ee7d68afb6fba9e640fd4cb8cc60ec1a
  verified: true
  verifier: sandbox-run tenir_governance@334109f (auteur, non indépendant)
  verified_at: '2026-10-19'
  description: 'Cross-host replication verified: state replicates to all 3 nodes after
    reserve from leader, commit from follower, and reserve from another follower.
    All nodes see consistent state.

    '
  evidence_type_note: 'Cross-host communication test is in the Magertron partner perimeter,
    not in public tenir_governance. Relinked from cap.host.multi-host to cap.host.single-host:
    v5.7 restricts Raft to loopback (FM-20).'
- capability_ids:
  - cap.uncertainty.fail-closed
  evidence_type: test.unknown-outcome.blocks
  evidence_ref: evidence/unknown-outcome-run.log
  evidence_sha256: eb35ed156a1eebeb2670256a25a6d3f9fdbd5b51ea174d27504a26e8d2890bf0
  verified: true
  verifier: sandbox-run tenir_governance@0df9a96 (auteur, non indépendant)
  verified_at: '2026-10-19'
  description: 'Résultat UNKNOWN passe en human_review, reprise bloquée. Mécanisme
    identique sur Raft (reconcile() via provider_reconcile).

    '
