# Profil multi-hôte avec consensus répliqué. Ce profil exige un backend de
# consensus distribué conforme à consensus-contract-v1.md. L'opérateur doit
# fournir un adapter ConsensusBackend (voir consensus-interface-v1.json) et
# un deployment.manifest décrivant le déploiement réel.
#
# Toutes les preuves sont manquantes : ce profil est NON attesté. Il sert de
# modèle pour un déploiement futur. Le vérificateur durci échoue (fail-closed)
# jusqu'à ce que toutes les preuves soient fournies avec hashes vérifiés.

profile_id: "consensus-replicated"
profile_version: "1.0.0"
description: >
  Consensus distribué répliqué multi-hôte. Déduplication par registre répliqué,
  réservations atomiques par consensus, UNKNOWN fail-closed.
  Exige un adapter ConsensusBackend conforme à consensus-contract-v1.md.

config:
  HOST_SCOPE: "multi-host"
  DEDUP_LAYER: "distributed-consensus-registry"
  CONCURRENCY: "distributed-consensus"
  UNCERTAINTY: "fail-closed"

# Modèle de faute paramétrique (voir consensus-contract-v1.md §4)
fault_model:
  crash: 1              # tolère 1 crash de nœud
  byzantine: 0          # pas de tolérance byzantine
  omission: 0           # pas de tolérance d'omission
  quorum: 2             # 2 nœuds sur 3 pour décider
  total_nodes: 3

# Vérification des bornes de résilience (crash-only) :
#   total_nodes (3) >= 2 * crash + 1 (3) ✓
#   quorum (2) >= crash + 1 (2) ✓

invariants:
  - "commit-binding"
  - "budget-ceiling-aggregate"    # I8 : reserved + committed <= capacity
  - "single-dispatch-per-reservation"
  - "linearizability"              # LIN : ordre linéarisable
  - "agreement"                   # AGR : au plus un commit par réservation

# Adapter requis : l'opérateur doit fournir un backend qui implémente
# ConsensusBackend (consensus-interface-v1.json) et satisfait C1/C2/C3/I8.
adapter:
  required: true
  interface_version: "1.0.0"
  # Exemples de backends conformes (non exclusif) :
  #   - etcd (Raft interne, linearizable reads)
  #   - PostgreSQL (synchronous replication, SERIALIZABLE)
  #   - Raft natif (implémentation maison auditée)
  backend_type: null              # à déclarer par l'opérateur
  backend_version: null           # à déclarer par l'opérateur

# Profil NON attesté. Les preuves requises (toutes manquantes) :
#   - cap.host.multi-host : deployment.manifest, test.cross-host.communication
#   - cap.dedup.consensus-registry : test.consensus.safety, test.consensus.liveness,
#     test.fault-tolerance, test.idempotency.distributed
#   - cap.concurrency.consensus : test.consensus.safety, test.consensus.liveness,
#     test.fault-tolerance
#   - cap.uncertainty.fail-closed : test.unknown-outcome.blocks
#
# Étape intermédiaire : le profil consensus-reference-single-host.yaml atteste
# C1, C2, I8 sur un seul hôte (SingleHostLockBackend, fcntl.flock). Ce profil
# multi-hôte exige un adapter ConsensusBackend déployé sur plusieurs hôtes
# (etcd, PostgreSQL répliqué, Raft natif) + un deployment.manifest réel.
# Voir consensus-reference-single-host.yaml pour les preuves single-host.

attestations: []
