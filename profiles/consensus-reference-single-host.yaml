profile_id: consensus-reference-single-host
profile_version: 1.1.0
description: 'Backend de coordination de référence (single-host, fcntl.flock). Implémente
  l''interface ConsensusBackend et satisfait SAF (safety/linearizability), LIV (liveness/termination)
  et BUD (budget conservation) sur un seul hôte. Ne satisfait PAS FT (cross-host fault
  tolerance). Sert de référence pour valider l''interface et le harnais de test avant
  un déploiement multi-hôte.

  '
config:
  HOST_SCOPE: mono-host
  DEDUP_LAYER: local-registry
  CONCURRENCY: file-lock
  UNCERTAINTY: fail-closed
fault_model:
  crash: 1
  byzantine: 0
  omission: 0
  quorum: 1
  total_nodes: 1
invariants:
- commit-binding
- budget-ceiling-aggregate
- single-dispatch-per-reservation
- linearizability
- agreement
adapter:
  required: false
  interface_version: 1.0.0
  backend_type: SingleHostLockBackend
  backend_version: 5.5.0
  backend_ref: tenir_governance/operations/consensus_backend.py
attestations:
- capability_ids:
  - cap.concurrency.file-lock
  evidence_type: test.lock.cross-process
  evidence_ref: evidence/test-consensus-safety.log
  evidence_sha256: 19330b7b00a08d26c85d64ed162644aa2957526c2d203fc378f4c293670feedf
  verified: true
  verifier: sandbox-run tenir-conformance-s1-g1 / tenir_governance@5.5.0 (auteur,
    non indépendant)
  verified_at: '2026-10-19'
  description: '30 tests de linearizability (Wing-Gong). Vérifie LIN, BUD, AGR sur
    histories séquentielles et concurrentes. Format conforme à evidence-type-specs-v1.md
    §6 (en-têtes structurées + sortie pytest).

    '
  evidence_type_note: Originally test.consensus.safety; relinked to file-lock backend.
