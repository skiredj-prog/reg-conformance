terms:

  # ------------------------------------------------------------------ invariants
  - id: GL-INV-MANUSCRIPT
    canonical: "I1 … I8"
    kind: invariant-namespace
    definition: >
      The identifiers I1 to I8 are reserved for the invariants of manuscript
      v7.2 §4.5a, with the meanings given there. The suite uses an `I<n>`
      identifier only when it imports that exact meaning (today: I2).
    defined_in: manuscript/v7.2.md §4.5a
    suite_ids_with_other_names: {BUD: "budget conservation", LIN: "linearizability", AGR: "agreement"}
    finding: verified

  - id: GL-INV-I2
    canonical: I2
    kind: invariant
    definition: "A permit bound to an attempt and LEI authorizes at most one effect-producing dispatch and cannot be consumed again."
    defined_in: manuscript/v7.2.md §4.5a (same text as v7.1)
    suite: catalog/capabilities-v1.yaml normative_invariants[I2]
    same_meaning: true
    finding: verified
    note: "contract_ref now cites v7.2 §4.5a; the definition is unchanged from v7.1."

  - id: GL-INV-I8
    canonical: I8
    kind: invariant
    definition: "Attempt-history permanence: for valid prefixes π1 ⊑ π2, the attempt records in π1 remain present and unaltered in π2."
    defined_in: manuscript/v7.2.md §4.5a, §5.3
