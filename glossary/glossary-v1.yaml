# REG vocabulary: canonical identifiers shared by the manuscript and the suite.
#
# This file is a versioned contract between layers (catalogue, TENIR proof,
# projection, presentation). It names each term once, states which source
# defines it, and records where the published manuscript v7.2 or the suite
# uses the same word for another object.
#
# Rules:
#   R1. The published manuscript is never edited. Where it and the suite
#       disagree, the suite takes a new name and the manuscript gets a reading
#       note in manuscript/ERRATA-v7.2.md.
#   R2. The frozen RFCs keep their text. Where an RFC term is canonical, the
#       suite and the next RFC revisions use it in the RFC sense only.
#   R3. Historical evidence logs keep the identifiers they were written with.
#       They are read through `aliases`, never rewritten.
#   R4. A term listed under `pending` still has old uses in the files named
#       there. tests/test_glossary.py tolerates those files and no others, so
#       the list can shrink but cannot grow unnoticed.
#
# Provenance tags on every finding:
#   verified  = read in the file and revision named in `sources`
#   inferred  = reasoned from the text, not stated by it
#
# Change control: a change of meaning is a MAJOR bump; a new term or a new
# alias is MINOR; a typo or a pending item closed is PATCH.

version: "1.0.0"
status: draft            # becomes "in force" when the author ratifies it
