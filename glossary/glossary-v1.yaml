  suite_release: {tag: v0.7.0, commit: 20016d2, note: "references re-checked against this release on 2026-11-20"}
  pr_77_rn001_registry: {head: f4a4fb9, status: "merged into main (028d25d), released in v0.7.0"}
  pr_76_claims: {head: 182190c, base: feat/property-view, status: "merged (1c80ad2), released in v0.7.0; CLAIMS.md in force"}
  rfc: reg-standards-baseline/rfc/ (frozen texts)
