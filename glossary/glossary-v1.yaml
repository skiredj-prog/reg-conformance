  # ------------------------------------------------------------------ time bounds
  - id: GL-TAU-K
    canonical: "τ_K"
    ascii: tau_K
    kind: time-bound
    definition: >
      Organizational veto window: the maximum time allowed for human resolution
      of a HOLD. Derived from documented organizational SLAs, never invented by
      the implementation. Its exhaustion applies the pre-declared exhaustion
      policy. A bound the policy declares fail-safe refuses alone (RN-001 §2a).
    defined_in: "RFC-0 §6; RFC-5 §1; RN-001 §2a"
    bound_carried_by: GL-BOUND-HELD-ATTEMPT   # τ_K is the declared bound of a held attempt, never of an authorization
    variants: {"τ_K^comp": "collective window of a composition, RFC-3 §6.4"}
    implementations: ["tenir_governance HoldManager tau_k_seconds", "composition/simulator.py (composition window)", "harness/port.py B_TAU_K and harness/scenarios.py, RFC-5 sense (from #76, in v0.7.0)"]
    manuscript_v7_2:
      same_meaning_in: ["§3.1 Ω component (inferred: Ω is not exercised in the paper)", "§9 composition simulator, 'τ_K is a supplied input' (verified against composition/simulator.py)"]
      other_meaning_in: ["§2.2", "§4.4", "§6.1", "§7.1 S2"]   # see GL-TAU-R
    finding: verified

  - id: GL-TAU-R
    canonical: "τ_R"
    ascii: tau_R
    kind: time-bound
    definition: >
      Receipt qualification window: how long an admitted attempt in AWAITING
      waits for a qualifying receipt. At t >= τ_R the attempt becomes UNKNOWN.
      Expiry never yields a resolution or a failure label (runtime RESOLVED or
      FAILED); the recorded state is UNKNOWN (GL-STATE-RECORDED).
    defined_in: "this glossary (new name for the manuscript's receipt bound)"
    manuscript_v7_2:
      written_as: "τ_K"
      locations: ["l.86 §2.2 (S2)", "l.229-230 §4.4 (admit and await, timeout)", "l.383 §6.1 (clock advance by τ_K)", "l.485 §7.1 (S2)"]
      errata: ERR-7.2-01
    implementation_names: "tenir-conformance-s1-g1 parameter tau_k_ms (AWAITING_QUALIFICATION deadline, membrane.py l.754 at d42499b) and explorer event advance(tau_K): read as τ_R, not renamed (verified)"
    suite_uses_needing_rename:
      - "runner.py l.13, l.16, l.114, l.116 at v0.7.0 (T6/T7 descriptions; l.107, l.109 at b943f06)"
      - "vectors/core.yaml CT-R4-011 input ('under τ_K discipline'), and vectors/dist/vectors.json"
    finding: verified
    pending:
      - {where: [runner.py, vectors/core.yaml, vectors/dist/vectors.json, lifecycle/register_core_lifecycle.py], change: "τ_K -> τ_R where the receipt window is meant", after: "next suite revision (#77 merged in v0.7.0 without this rename)"}
    guard:
      pattern: 'τ_K (qualification|discipline)|\(τ_K expiry\)|within τ_K'
      allowed: []

  - id: GL-VERDICT-AGE
    canonical: "verdict age"
    kind: time-quantity
    status: withdrawn-as-rule
    superseded_by: GL-BOUND-AUTHORIZATION
    definition: "Time elapsed since an admission (PASS or FLAG) was rendered."
    defined_in: "RN-001 §2b, §3"
    withdrawn_by: "author decision 2026-11-19; RFC-4 v0.3 §4"
    note: >
      RN-001 §2b read verdict age as "an epistemic input to readjudication".
      That reading is withdrawn as a rule: an expiry is both a block and a
      record, and which constraint applies depends on the object that carries
      the bound. Do not use "epistemic input" or "barrier" as a global
      qualifier of an expiry.
    symbol: none
    finding: verified

  - id: GL-FRESHNESS
    canonical: "freshness threshold"
    kind: policy-parameter
    status: withdrawn-as-rule
    superseded_by: GL-BOUND-AUTHORIZATION
    definition: "Policy-declared age beyond which a verdict cannot be dispatched without a fresh adjudication that includes its age."
    defined_in: "RN-001 §3.1; vector CT-R4-014 (from #77, in v0.7.0)"
    withdrawn_by: "RFC-4 v0.3 §4: CT-R4-014 and CT-R4-015 superseded_by CT-R4-004a; CT-R4-016 superseded_by CT-R4-004b"
    symbol: none
    finding: verified

  # ------------------------------------------------------------------ which object carries a bound
  - id: GL-BOUND-AUTHORIZATION
    canonical: "bound of an authorization"
    kind: bound-object
    definition: >
      The declared bound carried by an authorization (grant, approval, permit;
      e.g. valid_until). Passing it extinguishes the right to act under that
      authorization: no effect may be produced, or attributed, under it. A
      fresh authorization may follow only as an explicitly declared deployment
      policy that is a fresh evaluation against the current state, whose effect
      carries the new authorization's own identity and evidence, and never the
      expired one's. REG fixes no duration.
    defined_in: "author decision 2026-11-19 (object 1); RFC-4 v0.3 §2.1"
    vector: CT-R4-004a
    not_to_be_confused_with: GL-BOUND-HELD-ATTEMPT
    finding: verified

  - id: GL-BOUND-HELD-ATTEMPT
    canonical: "bound of a held attempt"
    kind: bound-object
    definition: >
      The declared bound carried by a held attempt (HOLD, escalation); for a
      HOLD this is τ_K. Reaching it applies the pre-declared disposition,
      refusal by default, terminal for that attempt identity. A later effect
      needs a new attempt identity. A late approval, resolution or exit
      authorization does not reopen the attempt; readjudication is not an
      automatic exit. A bound declared but not receivable by the runtime counts
      as not applied.
    defined_in: "author decision 2026-11-19 (object 2); RFC-4 v0.3 §2.2; RFC-0 §6; REG-STATE-024"
    vector: CT-R4-004b
    bound: GL-TAU-K
    not_to_be_confused_with: GL-BOUND-AUTHORIZATION
    finding: verified

  - id: GL-CT-R4-004
    canonical: "CT-R4-004 -> CT-R4-004a, CT-R4-004b"
    kind: suite-vector
    definition:
      CT-R4-004: "v0.2 §5.2 item 4: valid_until passed before commit -> REJECT / EVALUATION_EXPIRED. Kept with its text and results (reference kernel PASS)."
      CT-R4-004a: "Commit under an authorization whose declared bound has passed: no effect attributed to the expired authorization (GL-BOUND-AUTHORIZATION)."
      CT-R4-004b: "Held attempt past its declared bound, then any advance under the same identity: no effect; pre-declared disposition recorded with the bound and the resulting state in canonical vocabulary (GL-BOUND-HELD-ATTEMPT)."
    defined_in: "RFC-4 v0.3 §5 (in force from v0.7.0)"
    superseded: {CT-R4-004: [CT-R4-004a, CT-R4-004b], CT-R4-014: [CT-R4-004a], CT-R4-015: [CT-R4-004a], CT-R4-016: [CT-R4-004b]}
    clash: >
      v0.2 CT-R4-004 speaks of the window of an admission (object 1); later
      scenarios read it as an expired HOLD (object 2). The split makes the two
      impossible to read as one.
    finding: verified

  # ------------------------------------------------------------------ recorded states
  - id: GL-STATE-RECORDED
    canonical: "CONFIRMED_NONEXECUTION | UNKNOWN (reconciliation required)"
    kind: enum
    definition: >
      What a record states is known about an attempt after an expiry (either
      object) or a closing of a hold. The state follows what the available
      evidence establishes, not the dispatch history.
      CONFIRMED_NONEXECUTION: available evidence establishes that the outcome
      was not executed (never dispatched; or dispatched, with a qualified
      rejection observed or a qualified, verified non-execution attestation).
      UNKNOWN, reconciliation required: dispatch possible and the evidence does
      not establish the outcome (no qualified rejection observed, and the
      attestation absent, contradictory or not qualified). This record is
      added to the blocking of GL-BOUND-AUTHORIZATION and GL-BOUND-HELD-ATTEMPT;
      it never replaces it. Closing a hold does not establish what happened
      outside.
    defined_in: "author decisions 2026-11-19 03:07 (B3), 06:11 (evidence criterion) and 2026-11-20 02:20 (qualified rejection); RFC-4 v0.3 §2.3; UNKNOWN also RFC-2 §3"
    examples:
      - "never dispatched -> CONFIRMED_NONEXECUTION"
      - "dispatch occurred, but qualified attestation establishes non-execution -> CONFIRMED_NONEXECUTION"
      - "dispatch occurred, and a qualified rejection of that dispatch was observed -> CONFIRMED_NONEXECUTION"
      - "dispatch occurred, attestation absent, contradictory or not qualified -> UNKNOWN, reconciliation required"
    vocabulary: "canonical vocabulary v6.3 as cited by the author (text not located, see sources)"
    finding: "verified (decision and RFC-4 v0.3 text); the v6.3 source itself not read"

  - id: GL-RUNTIME-LABEL
    canonical: "runtime label (not canonical)"
    kind: label-namespace
    definition: >
      Attempt-status labels of a runtime or of the manuscript's model. They are
      not terms of the canonical vocabulary and are mapped before a result is
      reported. A report showing an unmapped label does not establish the
      recorded state of RFC-4 v0.3 §2.2.
    labels:
      FAILED:
        mapping:
          never_dispatched: CONFIRMED_NONEXECUTION
          dispatched_with_qualified_rejection_observed: CONFIRMED_NONEXECUTION   # v7.2 §4.4 'dispatch, rejection observed'; decision 2026-11-20 02:20
          dispatched_with_verified_non_execution_attestation: CONFIRMED_NONEXECUTION   # T7, reconcile-FAILED; decision 2026-11-19 06:11
          dispatch_possible_without_qualifying_evidence: "UNKNOWN, reconciliation required"
        used_in: ["manuscript v7.2 §4.1 σ, §4.3, §4.4, §4.5a (I3, I5, I7), §5", "tenir-conformance-s1-g1 (T7, T8)", "tenir_governance", "vectors CT-R4-012, CT-R4-013"]
        decided: >
          Author, 2026-11-19 06:11 UTC: a verified, qualified non-execution
          attestation is the evidence that establishes non-execution; with it,
          reconciliation is done. FAILED reached after a dispatch on such an
          attestation (§4.4 `declare failed (T7)`, `reconcile, FAILED`) maps to
          CONFIRMED_NONEXECUTION. The dispatch history does not change it.
          Author, 2026-11-20 02:20 UTC: a qualified rejection observed after a
          dispatch also maps to CONFIRMED_NONEXECUTION, as in the manuscript.
          A qualified rejection is one that manuscript v7.2 §4.4 records as
          `dispatch, rejection observed`: the runtime observed the rejection of
          that dispatch, and the outcome is qualified with no effect recorded
          (RFC-4 v0.3 §2.3).
      # The four entries below: decided by the author, 2026-11-19 06:21 UTC
      # ("OK" to the four recommendations). Same rule: the canonical state
      # follows what the available evidence establishes.
      RESOLVED:
        status: decided
        mapping: CONFIRMED_EXECUTION
        note: "Name to be confirmed against the v6.3 text: the term for 'available evidence establishes that the outcome was executed'."
        why: "RESOLVED is reached only on a qualified receipt bound to id, LEI and nonce, or on bound fresh reconcile evidence (v7.2 §4.4): the evidence establishes execution."
      PENDING:
        status: decided
        mapping: "no recorded outcome while open; when closed with no dispatch claim -> CONFIRMED_NONEXECUTION; if dispatch cannot be excluded -> UNKNOWN, reconciliation required"
        why: "An open attempt has no outcome to establish yet; once closed, the evidence decides, as for any other label. Whether PENDING precedes dispatch is inferred (v7.2 §4.4 dispatches from 'new' and allows T7 from PENDING)."
      AWAITING:
        status: decided
        mapping: "UNKNOWN (reconciliation required once τ_R has passed without a qualifying receipt)"
        why: "The attempt was admitted and dispatched and no receipt yet establishes the outcome; τ_R only decides when reconciliation becomes required."
      ESCALATED:
        status: decided
        mapping: "UNKNOWN, reconciliation required"
        why: "ESCALATED follows contradictory evidence on a non-terminal attempt (v7.2 §4.4): contradictory evidence establishes nothing. As a held state it also carries a declared bound (GL-BOUND-HELD-ATTEMPT)."
      UNKNOWN: {mapping: "UNKNOWN (same term; reconciliation required)"}
    defined_in: "author decisions 2026-11-19 03:07, 06:11 and 06:21; RFC-4 v0.3 §2.3"
    errata: ERR-7.2-05
    finding: verified

  # ------------------------------------------------------------------ vectors and checks
  - id: GL-CT-R4-005
    canonical: CT-R4-005
    kind: suite-vector
    definition: >
      Commit-state binding: the governance state (policy_epoch) changes between
      verdict and commit. Required outcome: no effect under the changed state;
      terminal refusal, or suspension with a declared resumption condition.
    defined_in: "vectors/commit.yaml as rewritten by #77 (in v0.7.0), per RN-001 §4"
    internal_clash:
      - {source: "RFC-4 §2.2 body", says: "MUST ... trigger HARD_VETO"}
      - {source: "RFC-4 §5.2 item 5", says: "REJECT / STATE_DRIFT"}
      - {source: "vectors/commit.yaml on main b943f06", says: "expected: HARD_VETO"}
      - {source: "#77, in v0.7.0", says: "no effect; terminal refusal, or suspension with a declared resumption condition"}
    resolution: "The #77 text (v0.7.0) is canonical; RFC-4 v0.3 §3 (in force from v0.7.0) carries the RN-001 §4 outcome and supersedes the v0.2 §2.2 HARD_VETO sentence."
    manuscript_v7_2:
      same_meaning: true    # v7.2 cites this suite vector; the id appears in no revision of tenir-conformance-s1-g1
      locations: ["l.10 changelog 7.1", "l.61 §1.1 (traceability list)", "l.647 §10.1"]
      clash: "§10.1 attaches to it the S11 commit binding (GL-MEM-COMMIT-BINDING), which does not test it; the evaluated membrane has no policy epoch or state hash, so neither environment drift nor governance-state change is captured"
      errata: ERR-7.2-02   # revised 2026-11-23; the 19-20 November draft read the id as a name for the S11 binding
    finding: verified

  - id: GL-MEM-COMMIT-BINDING
    canonical: "harness commit binding (S11)"
    kind: harness-check
    definition: >
      The check in tenir-conformance-s1-g1 that binds the transition and payload
      hashes at verdict and at commit (§7.9, S11). It does not capture drift of
      the external environment between verdict and commit.
    defined_in: "manuscript/v7.2.md §7.9, §10.1"
    closest_suite_vectors: ["CT-R4-001", "CT-R4-002"]   # CT-R4-002 verified: the membrane labels its S11 action-binding test CT-R4-002 (tests/test_g0_s11_transition.py at d42499b); CT-R4-001 inferred
    does_not_test: CT-R4-005
    finding: "verified (definition, CT-R4-002 label); inferred (CT-R4-001)"

  - id: GL-LIFECYCLE-T
    canonical: "T6, T7, T8"
    kind: lifecycle-transition
    labels: runtime   # RESOLVED, FAILED, UNKNOWN below are runtime labels, see GL-RUNTIME-LABEL
    definition:
      T6: "UNKNOWN or AWAITING -> RESOLVED, only on qualified evidence (vector CT-R4-011)"
      T7: "UNKNOWN/AWAITING/PENDING -> FAILED, only on a verified non-execution attestation (vector CT-R4-012)"
      T8: "FAILED with verified non-execution and retry_eligible -> new attempt allowed, never automatic execution (vector CT-R4-013)"
    canonical_reading: >
      T7 and T8 are reported in canonical terms only after mapping FAILED
      (GL-RUNTIME-LABEL). T8's "new attempt" is the new attempt identity that
      GL-BOUND-HELD-ATTEMPT requires for any later effect.
    defined_in: "T6: this suite only (LIFECYCLE_INTEGRATION.md, lifecycle/attempt_state.py, runner.py header); tenir-conformance-s1-g1 does not use the name (d42499b, 8bc0e5e, main). T7, T8: tenir-conformance-s1-g1 (membrane docstring, tests/test_t7_t8_failed_retry.py) at d42499b and 8bc0e5e (pinned in .github/workflows/lifecycle.yml); T7 also manuscript v7.2 §4.4"
    manuscript_v7_2:
      names_only: T7      # §4.4 'declare failed (T7)'
      absent: [T6, T8]
    clash: >
      vectors/core.yaml, runner.py and VECTORS.md cite "Manuscript v7.2 §4.4,
      transition T6" and "transition T8". The manuscript names neither.
    finding: verified
    pending:
      - {where: [vectors/core.yaml, vectors/dist/vectors.json, runner.py, VECTORS.md, lifecycle/register_core_lifecycle.py], change: "cite T6 to this suite's lifecycle vocabulary and T8 to tenir-conformance-s1-g1@8bc0e5e; keep §4.4 only for T7 and for the untagged rows it mirrors", after: "next suite revision (#77 merged in v0.7.0 without this change)"}
    guard:
      pattern: 'v7\.2 §4\.4.*\bT[68]\b|\bT[68] \(manuscript v7\.2'
      allowed: []

  - id: GL-RETRY-ELIGIBLE
    canonical: retry_eligible
    kind: field
    definition: "Flag on an attempt with runtime label FAILED (GL-RUNTIME-LABEL). At tenir-conformance-s1-g1 d42499b it is an audit annotation only; from 8bc0e5e it is a further admission condition."
    defined_in: "manuscript/v7.2.md §4.4 (both revisions named)"
    note: "CT-R4-013 follows 8bc0e5e, the revision the suite pins, not d42499b, the revision the paper evaluates. Not a contradiction; cite the revision with the result."
    finding: verified

  - id: GL-SCENARIO-S
    canonical: "S1 … S12"
    kind: scenario-namespace
    definition: "Scenario campaign of tenir-conformance-s1-g1 (manuscript §7). Suffixed cases (S1a, S2c, S12f …) are sub-cases of the same campaign. There is no S9: eleven numbered scenarios, S1–S8 and S10–S12 (manuscript §7.1; CI workflow at d42499b)."
    same_meaning: true
    finding: verified

  # ------------------------------------------------------------------ outcomes and statuses
  - id: GL-DISPOSITION
    canonical: "disposition: PASS | FLAG | HOLD | HARD_VETO"
    kind: enum
    definition: "The four execution dispositions of RFC-0 §4, also D(τ, Ω) in manuscript §3.1."
    same_meaning: true
    clash: >
      `PASS` is also a test outcome (GL-OUTCOME). Write `disposition PASS` or
      `outcome PASS` whenever both can be read. The manuscript's client
      projection (UNKNOWN, HOLD) in §4.2 uses HOLD as the disposition shown to
      the client; same meaning. v7.2 §1.1 (l.51) also calls QUARANTINE_LOCK
      (an LEI-level guard) and FAILED (an attempt label) dispositions; the
      evaluated membrane returns PASS, HOLD and HARD_VETO.
    manuscript_v7_2:
      same_meaning: false
      locations: ["l.51 §1.1"]
      errata: ERR-7.2-06
    finding: verified

  - id: GL-OUTCOME
    canonical: "outcome: PASS | FAIL | INCONCLUSIVE | NOT_APPLICABLE | ADAPTER_REQUIRED | IMPLEMENTATION_GAP"
    kind: enum
    definition: "Result of one test in one run (CLAIMS.md, in force from v0.7.0; vectors/schema.json `native`)."
    finding: verified

  - id: GL-CLAIM-LEVEL
    canonical: "level 1 semantic mapping | level 2 adapter-tested | level 3 native-conformant"
    kind: enum
    definition: "How the subject was reached in a run (CLAIMS.md, in force from v0.7.0)."
    finding: verified
    note: >
      "Démontré" (demonstrated) is a catalogue status for a capability with a
      verified attestation (capability-evidence-contract-v1.json,
      effective_guarantee_demonstrated). Vectors have no "demonstrated"
      status. For a vector on a runtime, say: "outcome PASS at level 2 on
      <subject>@<revision>".

