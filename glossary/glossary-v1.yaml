  - id: GL-INV-BUD
    canonical: BUD
    kind: invariant
    definition: "Aggregate budget conservation: reserved + committed <= capacity, per resource_id, at every intermediate state."
    defined_in: catalog/capabilities-v1.yaml normative_invariants[BUD]; specs/consensus-contract-v1.md §2.4
    aliases:
      - {alias: I8, where: "tenir_governance up to 5.7.6 (code, CHANGELOG, .zenodo.json; verified at 1881c90); catalogue <= v1.1.0 (tag v0.6.2 included); harness/ports/tenir_gov.py, which names the TENIR-Gov invariant; evidence logs written before the rename (ERR-7.2-04)", read_as: BUD}
