  rfc_4_v0_3: "revisions/rfc-4-v0.3-2026-11-19.md (ratified by the author 2026-11-19, amended 2026-11-20; in force from v0.7.0; outside the frozen baseline; RFC-4 v0.2 stays frozen)"
