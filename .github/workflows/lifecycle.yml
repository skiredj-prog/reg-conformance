name: lifecycle T6-T8 (lab contract only)

on:
  push:
  pull_request:

jobs:
  lifecycle-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runner dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Install the TENIR-Gov target pinned in conformance-target.json
        run: |
          commit=$(python -c 'import json; print(json.load(open("conformance-target.json"))["implementation"]["source_commit"])')
          python -m pip install "git+https://github.com/skiredj-prog/tenir_governance.git@${commit}"
          python tools/verify_conformance_target.py
          # 5.7.0 is also what later, untagged commits report: check the commit itself.
          python -c "import importlib.metadata as m, json, sys; d = json.loads(m.distribution('tenir-governance').read_text('direct_url.json')); got = d['vcs_info']['commit_id']; sys.exit(0 if got == '${commit}' else f'installed {got}, pinned ${commit}')"
      - name: Install pinned lab membrane PR candidate
        run: python -m pip install "git+https://github.com/skiredj-prog/tenir-conformance-s1-g1.git@8bc0e5e291f7ac64d601bb08d76b5f2c3f70562f"
      - name: Test T6-T8 lab probes and no native promotion
        run: python -m pytest tests/test_lifecycle_probes.py -q --tb=short
      - name: Run 61-vector bundled reference (non-certifying)
        shell: bash
        run: |
          mkdir -p artifacts/lifecycle
          set +e
          python runner.py --mode native --output artifacts/lifecycle/reference-61.json > artifacts/lifecycle/runner-stdout.txt 2>&1
          status=$?
          set -e
          echo "runner_exit_code=$status" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/lifecycle/runner-stdout.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/lifecycle/reference-61.json")
          r = json.loads(p.read_text())
          assert r["vector_sets"] == {"core": 23, "extended": 38, "total": 61}, r["vector_sets"]
          assert len(r["results"]) == 61
          counts = r["summary"]
          assert sum(counts.values()) == 61
          print("REFERENCE_RUN_ONLY:", counts, "exit_code:", r["exit_code"])
          Path("artifacts/lifecycle/verification.json").write_text(
              json.dumps({"scope": "bundled-reference-only", "total": 61,
                          "summary": counts, "exit_code": r["exit_code"]}, indent=2)
          )
          PY
          sha256sum artifacts/lifecycle/*.json > artifacts/lifecycle/SHA256SUMS
      - name: Upload bundled reference evidence (not native TENIR-Gov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reg-61-vector-reference-only
          path: artifacts/lifecycle/
          if-no-files-found: warn
