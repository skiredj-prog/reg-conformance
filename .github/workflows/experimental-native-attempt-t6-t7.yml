name: experimental-native-attempt-T6-T7
on:
  workflow_dispatch:
  push:
    branches: ['audit/native-t6-t7-candidate-isolated']
  pull_request:
    paths:
      - 'qualification_candidates/**'
      - '.github/workflows/experimental-native-attempt-t6-t7.yml'
permissions:
  contents: read
jobs:
  signed-candidate-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact experimental candidate (not released 5.7.0)
        run: |
          python -m pip install 'tenir-governance[ep02] @ git+https://github.com/skiredj-prog/tenir_governance.git@aa8f947adee87c793201fba47206543cd68c45ac'
      - name: Execute REG native experimental vectors
        run: |
          mkdir -p results
          python qualification_candidates/native_t6_t7_probe.py --output results/experimental-native-t6-t7.json
      - name: Enforce no normative promotion and preserve file hashes
        run: |
          python - <<'PY'
          import json,hashlib,pathlib,importlib.metadata as metadata
          report_path=pathlib.Path("results/experimental-native-t6-t7.json")
          report=json.loads(report_path.read_text())
          assert report["verdict"]=="PARTIAL_CANDIDATE_EVIDENCE"
          assert report["native_normative_conformance"] is False
          assert report["pinned_source_commit"]=="aa8f947adee87c793201fba47206543cd68c45ac"
          assert report["vectors"]["CT-R4-011"]["status"]=="SCOPED_CANDIDATE_PASS"
          assert report["vectors"]["CT-R4-012"]["status"]=="SCOPED_CANDIDATE_PASS"
          assert report["vectors"]["CT-R4-013"]["status"]=="IMPLEMENTATION_GAP"
          assert metadata.version("tenir-governance")=="5.7.0", "Source branch retains historical package version"
          hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path("results").iterdir() if p.is_file()}
          pathlib.Path("results/sha256.json").write_text(json.dumps(hashes,indent=2)+"\n")
          PY
          python -m pip freeze > results/dependency-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-T6-T7-isolated
          path: results/
          if-no-files-found: error
