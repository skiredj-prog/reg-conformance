name: experimental-native-attempt-T6-T7
on:
  workflow_dispatch:
  push:
    branches: ['audit/native-t6-t7-candidate-isolated']
  pull_request:
    paths:
      - 'qualification_candidates/**'
      - '.github/workflows/experimental-native-attempt-t6-t7.yml'
permissions:
  contents: read
jobs:
  signed-candidate-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact experimental candidate (not released 5.7.0)
        run: |
          python -m pip install 'tenir-governance[ep02] @ git+https://github.com/skiredj-prog/tenir_governance.git@97c1192c31b67045ec6b8bac11450a79dcd1eab1'
      - name: Execute REG native experimental vectors
        run: |
          mkdir -p results
          python qualification_candidates/native_t6_t7_probe.py --output results/experimental-native-t6-t7.json
      - name: Enforce no normative promotion and preserve file hashes
        run: |
          python - <<'PY'
          import json,hashlib,pathlib,importlib.metadata as metadata
          report_path=pathlib.Path("results/experimental-native-t6-t7.json")
          report=json.loads(report_path.read_text())
          assert report["verdict"]=="PARTIAL_CANDIDATE_EVIDENCE"
          assert report["native_normative_conformance"] is False
          assert report["pinned_source_commit"]=="97c1192c31b67045ec6b8bac11450a79dcd1eab1"
          assert report["vectors"]["CT-R4-011"]["status"]=="SCOPED_CANDIDATE_PASS"
          assert report["vectors"]["CT-R4-012"]["status"]=="SCOPED_CANDIDATE_PASS"
          assert report["vectors"]["CT-R4-013"]["status"]=="IMPLEMENTATION_GAP"
          assert report["vectors"]["governor_registry_observer"]["status"]=="SCOPED_OBSERVATION_PASS"
          assert report["vectors"]["governor_registry_observer"]["execution_authorized"] is False
          assert report["vectors"]["atomic_source_attempt_candidate"]["status"]=="SCOPED_ATOMIC_SQLITE_PASS"
          assert report["vectors"]["atomic_source_attempt_candidate"]["execution_authorized"] is False
          assert report["vectors"]["atomic_source_attempt_candidate"]["normative_conformant"] is False
          assert report["vectors"]["budget_colocation_guard"]["status"]=="SCOPED_NO_SETTLEMENT_PASS"
          assert report["vectors"]["budget_colocation_guard"]["budget_mutated"] is False
          assert report["vectors"]["shadow_registry_migration"]["status"]=="SCOPED_SHADOW_CAPTURE_PASS"
          assert report["vectors"]["shadow_registry_migration"]["execution_authorized"] is False
          assert report["vectors"]["shadow_registry_migration"]["cutover_performed"] is False
          assert report["vectors"]["shadow_budget_parity_preflight"]["status"]=="SCOPED_G1_PARITY_PASS"
          assert report["vectors"]["shadow_budget_parity_preflight"]["execution_authorized"] is False
          assert report["vectors"]["shadow_budget_parity_preflight"]["cutover_authorized"] is False
          assert report["vectors"]["g3_shadow_fencing"]["status"]=="SCOPED_G3_FENCED_HOLD_PASS"
          assert report["vectors"]["g3_shadow_fencing"]["execution_authorized"] is False
          assert report["vectors"]["g3_shadow_fencing"]["production_cutover"] is False
          assert report["vectors"]["g3_shadow_fencing"]["missing_finalized_marker_is_hold"] is True
          assert report["vectors"]["g1_atomic_budget_candidate"]["status"]=="SCOPED_G1_ATOMIC_I8_CANDIDATE_PASS"
          assert report["vectors"]["g1_atomic_budget_candidate"]["execution_authorized"] is False
          assert report["vectors"]["g1_atomic_budget_candidate"]["production_cutover"] is False
          assert report["vectors"]["g1_atomic_budget_candidate"]["candidate_namespace_only"] is True
          assert report["vectors"]["g1_atomic_budget_candidate"]["single_sqlite_transaction"] is True
          assert report["vectors"]["g1_atomic_budget_candidate"]["normative_conformant"] is False
          assert metadata.version("tenir-governance")=="5.7.0", "Source branch retains historical package version"
          hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path("results").iterdir() if p.is_file()}
          pathlib.Path("results/sha256.json").write_text(json.dumps(hashes,indent=2)+"\n")
          PY
          python -m pip freeze > results/dependency-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-T6-T7-isolated
          path: results/
          if-no-files-found: error
