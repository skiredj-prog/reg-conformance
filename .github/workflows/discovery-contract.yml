name: REG Discovery contract v0.1

on:
  push:
    branches:
      - feat/reg-discovery-report-contract-v0
    paths:
      - 'discovery/**'
      - '.github/workflows/discovery-contract.yml'
  pull_request:
    paths:
      - 'discovery/**'
      - '.github/workflows/discovery-contract.yml'

permissions:
  contents: read

jobs:
  discovery-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<10' 'jsonschema>=4,<5'
      - run: python -m pytest -q discovery/tests/test_discovery_report.py
