name: coherence
on: { push: {}, pull_request: {} }
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt jsonschema pytest
      - name: Fetch the declared target source
        run: |
          repo=$(python -c 'import json; print(json.load(open("conformance-target.json"))["implementation"]["repository"])')
          commit=$(python -c 'import json; print(json.load(open("conformance-target.json"))["implementation"]["source_commit"])')
          git init -q "$RUNNER_TEMP/target"
          git -C "$RUNNER_TEMP/target" fetch -q --depth 1 "$repo" "$commit"
          git -C "$RUNNER_TEMP/target" checkout -q FETCH_HEAD
          echo "REG_TARGET_SOURCE=$RUNNER_TEMP/target" >> "$GITHUB_ENV"
      - name: Tests of the check itself (including mutation kill)
        env:
          COHERENCE_MUTATION_EVIDENCE_PATH: ${{ runner.temp }}/coh-x06-mutant.log
        run: python -m pytest -q tests/test_coherence.py
      - name: Archive old fail-open mutant test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coh-x06-mutation-kill
          path: ${{ runner.temp }}/coh-x06-mutant.log
          if-no-files-found: warn
      - name: Report
        run: python tools/check_coherence.py --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: No finding outside the baseline, no stale baseline entry
        run: python tools/check_coherence.py
