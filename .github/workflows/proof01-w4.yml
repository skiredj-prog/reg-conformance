name: PROOF-01 W4 independent verifier
on:
  push:
    paths:
      - 'proof01_w4/**'
      - '.github/workflows/proof01-w4.yml'
  pull_request:
    paths:
      - 'proof01_w4/**'
      - '.github/workflows/proof01-w4.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent cryptographic verifier dependency
        run: python -m pip install -r proof01_w4/requirements-verifier.txt
      - name: Record exact checkout and environment
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD | tee w4-checkout.txt
          test "$(cat w4-checkout.txt)" = "$EXPECTED_SHA"
          python -c "import sys,platform,cryptography,json,importlib.metadata as m; print(json.dumps({'python':sys.version,'platform':platform.platform(),'cryptography':cryptography.__version__,'jsonschema':m.version('jsonschema')},indent=2))" > w4-environment.json
          python -m pip freeze > w4-dependencies.txt
      - name: Run offline adversarial unit tests
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s proof01_w4/tests -v 2>&1 | tee w4-tests.log
      - name: Preserve bounded W4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w4-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            w4-checkout.txt
            w4-environment.json
            w4-tests.log
            w4-dependencies.txt
