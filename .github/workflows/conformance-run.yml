name: REG Conformance - Run

# One run = one subject revision, one evidence bundle.
#
# Three ways in:
#   - "Run workflow" button on this repository (workflow_dispatch)
#   - `uses:` from another repository (workflow_call), so a runtime owner runs
#     the suite from their own repository without write access to this one
#   - push to the harness branch, which runs the reference target as a self-check
#
# A green run is not a certification. FAIL, INCONCLUSIVE and HARNESS_ERROR
# (a test that did not run to a result) make the job fail; gaps and
# ADAPTER_REQUIRED do not, and are listed in the bundle.
#
# `target` names what the vectors run against. The step "Resolve the target"
# is the only place a name becomes a port; an unknown name fails the job there,
# before anything runs, instead of running the reference under another name.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to run the vectors against"
        type: choice
        options: [reference]
        default: reference
  workflow_call:
    inputs:
      target:
        description: "What to run the vectors against: reference (the only target today)"
        type: string
        default: reference
      harness_ref:
        description: "reg-conformance commit to run"
        type: string
        required: true
  push:
    branches: [feat/neutral-harness]
    paths: ["harness/**", "tools/make_evidence_bundle.py", ".github/workflows/conformance-run.yml", "tests/test_harness.py"]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve the target
        id: target
        shell: bash
        env:
          TARGET: ${{ inputs.target || 'reference' }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            reference) port="harness.ports.reference:ReferencePort";;
            *) echo "::error::unknown target '$TARGET'; this workflow runs: reference"; exit 1;;
          esac
          echo "name=$TARGET" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Check out the harness
        uses: actions/checkout@v4
        with:
          repository: skiredj-prog/reg-conformance
          ref: ${{ inputs.harness_ref || github.sha }}
          path: harness-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        run: python -m pip install -r harness-src/requirements.txt pytest

      - name: Check the instrument
        working-directory: harness-src
        run: python -m pytest tests/test_harness.py -q

      - name: Run
        id: run
        working-directory: harness-src
        shell: bash
        env:
          PORT: ${{ steps.target.outputs.port }}
        run: |
          # The harness exits 4 on HARNESS_ERROR, 1 on FAIL, 3 on INCONCLUSIVE and
          # 2 on gaps: capture the code, decide later.
          set +e
          set -uo pipefail
          out="$RUNNER_TEMP/run"; mkdir -p "$out"
          args=(--port "$PORT")
          python -m harness "${args[@]}" --probes --output "$out/report.json" 2>&1 | tee "$out/run.log"
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build the evidence bundle
        working-directory: harness-src
        shell: bash
        run: |
          python tools/make_evidence_bundle.py --report "$RUNNER_TEMP/run/report.json" \
            --log "$RUNNER_TEMP/run/run.log" --out "$RUNNER_TEMP/evidence" \
            --zip "$RUNNER_TEMP/reg-evidence-${{ steps.target.outputs.name }}.zip" | tee "$RUNNER_TEMP/bundle.txt"
          {
            echo "### REG Conformance run: ${{ steps.target.outputs.name }}"
            echo
            echo "Not a certification. One subject revision, one run."
            echo
            echo '```'
            cat "$RUNNER_TEMP/bundle.txt"
            echo
            cat "$RUNNER_TEMP/evidence/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: reg-evidence-${{ steps.target.outputs.name }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error

      - name: Fail on FAIL, INCONCLUSIVE or HARNESS_ERROR
        shell: bash
        run: |
          case "${{ steps.run.outputs.code }}" in
            0|2) echo "no FAIL (code ${{ steps.run.outputs.code }}: 2 means gaps or adapter required)";;
            1)   echo "FAIL results present"; exit 1;;
            3)   echo "INCONCLUSIVE results present"; exit 1;;
            4)   echo "HARNESS_ERROR: a test did not run to a result; this run is not a conformance result"; exit 1;;
            *)   echo "unexpected harness exit code ${{ steps.run.outputs.code }}: not a result"; exit 1;;
          esac
