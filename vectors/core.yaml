meta:
  name: core
  version: 1.0.0
  description: Core REG invariants (RFC-0 to RFC-4)
vectors:
  - id: C1
    rfc: RFC-3
    category: core
    property: Standing Gate
    input: Actor with invalid credential
    intended: HARD_VETO — no structural computation
    expected: HARD_VETO
    status: implemented
    native: PASS
    observed: HARD_VETO on standing failure (native)
    reference: RFC-3 §4.1

  - id: C2
    rfc: RFC-2
    category: core
    property: Structure Gate
    input: P≥0.9, V≥0.9, K≤0.15
    intended: FLAG or HARD_VETO — never PASS
    expected: FLAG or HARD_VETO
    status: implemented
    native: PASS
    observed: HARD_VETO extreme pressure (native)
    reference: RFC-2 §3.2

  - id: C3
    rfc: RFC-3 §4.2; RFC-4 §2.2
    category: core
    property: Standing Continuity at Commit
    input: Standing revoked between verdict and commit
    intended: HARD_VETO; commit blocked
    expected: HARD_VETO
    status: implemented
    native: FAIL
    observed: commit accepted — revocation prospective
    reference: RFC-3 §4.2; RFC-4 §2.2

  - id: C4
    rfc: RFC-1
    category: core
    property: Fail-Closed Transport Safety
    input: Transport fault or 5xx
    intended: No execution proceeds
    expected: no execution
    status: implemented
    native: NOT_APPLICABLE
    observed: No transport layer in in-process kernel
    reference: RFC-1 §5

  - id: C5
    rfc: RFC-1 §2.1; RFC-4 §2.1
    category: core
    property: Replay Soundness — Idempotency
    input: Duplicate nonce or request
    intended: REJECT / NONCE_REPLAY
    expected: REJECT
    status: implemented
    native: PASS
    observed: NONCE_REPLAY raised (native)
    reference: RFC-1 §2.1

  - id: CT-R4-011
    rfc: RFC-4 lifecycle T6
    category: core
    property: UNKNOWN → RESOLVED (qualified)
    input: Qualified receipt or explicit resolve under τ_K discipline
    intended: RESOLVED; timeout alone does not resolve
    expected: RESOLVED when qualified
    status: lab_validated
    native: IMPLEMENTATION_GAP
    observed: Validated in tenir-conformance-s1-g1 membrane (S2c); native runner adapter pending
    reference: RFC-4 attempt lifecycle T6

  - id: CT-R4-012
    rfc: RFC-4 lifecycle T7
    category: core
    property: UNKNOWN → FAILED (evidence guard)
    input: declare_failed without/with evidence_qualified
    intended: REJECT without qualification; FAILED with qualification
    expected: evidence guard enforced; timeout ≠ FAILED
    status: lab_validated
    native: IMPLEMENTATION_GAP
    observed: Validated in tenir-conformance-s1-g1 (test_t7_t8); native adapter pending
    reference: RFC-4 attempt lifecycle T7

  - id: CT-R4-013
    rfc: RFC-4 lifecycle T8
    category: core
    property: FAILED + retry_eligible → new attempt
    input: FAILED with retry_eligible true/false
    intended: new attempt_id allowed only if retry_eligible
    expected: LEI unlock only when retry_eligible=true
    status: lab_validated
    native: IMPLEMENTATION_GAP
    observed: Validated in tenir-conformance-s1-g1 (T8 tests); native adapter pending
    reference: RFC-4 attempt lifecycle T8
