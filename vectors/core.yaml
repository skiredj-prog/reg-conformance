meta:
  name: core
  version: 1.0.0
  description: Core REG invariants (RFC-0 to RFC-4)
vectors:
  - id: C1
    rfc: RFC-3
    category: core
    property: Standing Gate
    input: Actor with invalid credential
    intended: HARD_VETO — no structural computation
    expected: HARD_VETO
    status: implemented
    native: PASS
    observed: HARD_VETO on standing failure (native)
    reference: RFC-3 §4.1

  - id: C2
    rfc: RFC-2
    category: core
    property: Structure Gate
    input: P≥0.9, V≥0.9, K≤0.15
    intended: FLAG or HARD_VETO — never PASS
    expected: FLAG or HARD_VETO
    status: implemented
    native: PASS
    observed: HARD_VETO extreme pressure (native)
    reference: RFC-2 §3.2

  - id: C3
    rfc: RFC-3 §4.2; RFC-4 §2.2
    category: core
    property: Standing Continuity at Commit
    input: Standing revoked between verdict and commit
    intended: HARD_VETO; commit blocked
    expected: HARD_VETO
    status: implemented
    native: FAIL
    observed: commit accepted — revocation prospective
    reference: RFC-3 §4.2; RFC-4 §2.2

  - id: C4
    rfc: RFC-1
    category: core
    property: Fail-Closed Transport Safety
    input: Transport fault or 5xx
    intended: No execution proceeds
    expected: no execution
    status: implemented
    native: NOT_APPLICABLE
    observed: No transport layer in in-process kernel
    reference: RFC-1 §5

  - id: C5
    rfc: RFC-1 §2.1; RFC-4 §2.1
    category: core
    property: Replay Soundness — Idempotency
    input: Duplicate nonce or request
    intended: REJECT / NONCE_REPLAY
    expected: REJECT
    status: implemented
    native: PASS
    observed: NONCE_REPLAY raised (native)
    reference: RFC-1 §2.1
