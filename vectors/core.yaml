meta:
  name: core
  version: 1.0.0
  description: Core REG invariants (RFC-0 to RFC-4)
vectors:
  - id: C1
    rfc: RFC-3
    category: core
    property: Standing Gate
    input: Actor with invalid credential
    intended: HARD_VETO — no structural computation
    expected: HARD_VETO
    status: implemented
    native: PASS
    observed: HARD_VETO on standing failure (native)
    reference: RFC-3 §4.1

  - id: C2
    rfc: RFC-2
    category: core
    property: Structure Gate
    input: P≥0.9, V≥0.9, K≤0.15
    intended: FLAG or HARD_VETO — never PASS
    expected: FLAG or HARD_VETO
    status: implemented
    native: PASS
    observed: HARD_VETO extreme pressure (native)
    reference: RFC-2 §3.2

  - id: C3
    rfc: RFC-3 §4.2; RFC-4 §2.2
    category: core
    property: Standing Continuity at Commit
    input: Standing revoked between verdict and commit
    intended: No effect under the changed state; terminal refusal, or suspension with a declared resumption condition
    expected: no effect; terminal refusal, or suspension with a declared resumption condition
    status: implemented
    native: PASS
    observed: "post-verdict revocation produced HARD_VETO; commit blocked (native): STANDING_REVOKED:HARD_VETO"
    reference: RFC-3 §4.2; RFC-4 §2.2; RN-001 §4

  - id: C4
    rfc: RFC-1
    category: core
    property: Fail-Closed Transport Safety
    input: Transport fault or 5xx
    intended: No execution proceeds
    expected: no execution
    status: specified
    native: NOT_APPLICABLE
    observed: No transport layer in in-process kernel
    reference: RFC-1 §5

  - id: C5
    rfc: RFC-1 §2.1; RFC-4 §2.1
    category: core
    property: Replay Soundness — Idempotency
    input: Duplicate nonce or request
    intended: REJECT / NONCE_REPLAY
    expected: REJECT
    status: implemented
    native: PASS
    observed: NONCE_REPLAY raised (native)
    reference: RFC-1 §2.1

  - id: CT-R4-011
    rfc: "Lifecycle T6 (this suite's lifecycle vocabulary, LIFECYCLE_INTEGRATION.md; not in the frozen RFC-4 text)"
    category: core
    property: UNKNOWN → RESOLVED (qualified)
    input: Qualified receipt or explicit resolve within τ_R, the receipt qualification window
    intended: RESOLVED; timeout alone does not resolve
    expected: RESOLVED when qualified
    status: lab_validated
    native: IMPLEMENTATION_GAP
    observed: Validated in tenir-conformance-s1-g1 membrane (S2c); native runner adapter pending
    reference: "Suite lifecycle vocabulary, transition T6 (LIFECYCLE_INTEGRATION.md, lifecycle/attempt_state.py); behaviour of the manuscript v7.2 §4.4 row receipt"

  - id: CT-R4-012
    rfc: "Lifecycle T7 (manuscript v7.2 §4.4; not in the frozen RFC-4 text)"
    category: core
    property: UNKNOWN → FAILED (evidence guard)
    input: declare_failed without a verified attestation vs with a bound Ed25519 non-execution attestation
    intended: REJECT without cryptographic verification; FAILED only with verified non-execution evidence
    expected: timeout and boolean alone cannot declare FAILED; exact attempt/LEI/nonce binding is required
    status: lab_validated
    native: IMPLEMENTATION_GAP
    observed: Validated in tenir-conformance-s1-g1 (test_t7_t8); native adapter pending
    reference: "Manuscript v7.2 §4.4, transition T7"

  - id: CT-R4-013
    rfc: "Lifecycle T8 (tenir-conformance-s1-g1 at 8bc0e5e; not in the frozen RFC-4 text)"
    category: core
    property: FAILED + retry_eligible → new attempt
    input: FAILED with verified non-execution, no observed effect, and retry_eligible true/false
    intended: new attempt_id allowed only if retry_eligible and non-execution are verified
    expected: retry_eligible=false preserves LEI lock; true permits a fresh evaluation, never automatic execution
    status: lab_validated
    native: IMPLEMENTATION_GAP
    observed: Validated in tenir-conformance-s1-g1 (T8 tests); native adapter pending
    reference: "tenir-conformance-s1-g1 at 8bc0e5e, transition T8 (membrane docstring; tests/test_t7_t8_failed_retry.py)"
