meta:
  name: commit
  version: 1.0.0
  description: "Commit-phase REG conformance vectors for audit and record integrity"
  spec_version: 1.0.0

vectors:
  - id: CT-R4-001
    category: commit
    status: valid
    title: "Unique Execution Identifier"
    description: "Every commit record includes a globally unique execution identifier."
    phase: commit
    severity: critical
    tags: ["commit", "traceability", "identifier"]
    assertions:
      - statement: "Each execution record contains a unique identifier"
        validation: auditable
      - statement: "Identifiers are globally unique across all runtime instances"
        validation: deducible
    failure_mode: audit
    rationale: "Enables end-to-end traceability and audit correlation"
    spec_reference: "REG Spec § 6.4.1"
    added_version: "1.0.0"

  - id: CT-R4-002
    category: commit
    status: valid
    title: "Standard Timestamp"
    description: "Every commit record includes a standard timestamp at the point of execution."
    phase: commit
    severity: critical
    tags: ["commit", "timestamp", "chronology"]
    assertions:
      - statement: "Commit record includes a chronologically accurate timestamp"
        validation: observable
    failure_mode: audit
    rationale: "Maintains temporal ordering for audit and forensic analysis"
    spec_reference: "REG Spec § 6.4.2"
    added_version: "1.0.0"

  - id: CT-R4-003
    category: commit
    status: valid
    title: "Governing Policy Version"
    description: "Every commit record documents the version of the governance policy in effect."
    phase: commit
    severity: critical
    tags: ["commit", "policy", "versioning"]
    assertions:
      - statement: "Commit record includes the governing policy version identifier"
        validation: auditable
    failure_mode: audit
    rationale: "Allows replay and historical analysis of policy changes"
    spec_reference: "REG Spec § 6.4.3"
    added_version: "1.0.0"

  - id: CT-R4-004
    category: commit
    status: valid
    title: "Actor Identity"
    description: "Every commit record identifies the actor (user, service, or principal) that initiated execution."
    phase: commit
    severity: critical
    tags: ["commit", "identity", "accountability"]
    assertions:
      - statement: "Commit record includes actor identity with sufficient granularity for accountability"
        validation: auditable
    failure_mode: audit
    rationale: "Enables accountability and attribution in multi-tenant or shared environments"
    spec_reference: "REG Spec § 6.4.4"
    added_version: "1.0.0"

  - id: CT-R4-005
    category: commit
    status: valid
    title: "Input Digest"
    description: "Every commit record includes a cryptographic digest of the input material."
    phase: commit
    severity: high
    tags: ["commit", "integrity", "digest", "input"]
    assertions:
      - statement: "Commit record includes a cryptographic hash of the input"
        validation: measurable
      - statement: "Digest algorithm is documented and consistent"
        validation: auditable
    failure_mode: audit
    rationale: "Prevents tampering with input records and enables integrity verification"
    spec_reference: "REG Spec § 6.4.5"
    added_version: "1.0.0"

  - id: CT-R4-006
    category: commit
    status: valid
    title: "Execution Decision"
    description: "Every commit record includes the resulting governance decision (allow, deny, etc.)."
    phase: commit
    severity: critical
    tags: ["commit", "decision", "enforcement"]
    assertions:
      - statement: "Commit record includes the final enforcement decision"
        validation: auditable
    failure_mode: audit
    rationale: "Documents what was approved or rejected for compliance and analysis"
    spec_reference: "REG Spec § 6.4.6"
    added_version: "1.0.0"

  - id: CT-R4-007
    category: commit
    status: valid
    title: "Reason Code"
    description: "Every commit record includes a machine-readable reason code explaining the decision."
    phase: commit
    severity: high
    tags: ["commit", "reason", "diagnostic"]
    assertions:
      - statement: "Commit record includes a standardized reason code"
        validation: auditable
      - statement: "Reason codes follow a documented taxonomy"
        validation: deducible
    failure_mode: audit
    rationale: "Enables automated analysis and understanding of decision patterns"
    spec_reference: "REG Spec § 6.4.7"
    added_version: "1.0.0"

  - id: CT-R4-008
    category: commit
    status: valid
    title: "Trace Reference"
    description: "Every commit record includes a reference to the full execution trace."
    phase: commit
    severity: high
    tags: ["commit", "tracing", "observability"]
    assertions:
      - statement: "Commit record includes a reference to the full execution trace"
        validation: auditable
    failure_mode: audit
    rationale: "Enables deep inspection of decision logic and policy evaluation"
    spec_reference: "REG Spec § 6.4.8"
    added_version: "1.0.0"

  - id: CT-R4-009
    category: commit
    status: valid
    title: "Append-Only Semantics"
    description: "The commit record store implements strict append-only semantics with no mutation or deletion."
    phase: commit
    severity: critical
    tags: ["commit", "immutability", "append-only", "storage"]
    assertions:
      - statement: "Commit records can only be appended, never modified or deleted"
        validation: measurable
      - statement: "Storage backend enforces immutability guarantees"
        validation: deducible
    failure_mode: abort
    rationale: "Guarantees audit trail tamper-resistance and long-term integrity"
    spec_reference: "REG Spec § 6.5.1"
    added_version: "1.0.0"

  - id: CT-R4-010
    category: commit
    status: valid
    title: "Replayability Without State Loss"
    description: "Commit records are structured such that the full execution sequence can be replayed deterministically without loss of state."
    phase: audit
    severity: high
    tags: ["commit", "replay", "determinism", "audit"]
    assertions:
      - statement: "Commit records contain sufficient information for deterministic replay"
        validation: auditable
      - statement: "Replay execution produces identical outcomes"
        validation: measurable
    failure_mode: audit
    dependencies: ["CT-R4-001", "CT-R4-002", "CT-R4-004", "CT-R4-005"]
    rationale: "Enables audit verification, forensics, and dispute resolution"
    spec_reference: "REG Spec § 6.6.1"
    added_version: "1.0.0"
    notes: "Replay environment must match original environment; network calls may require mocking"
