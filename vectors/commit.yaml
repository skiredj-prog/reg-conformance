meta:
  name: commit
  version: 1.0.0
  description: RFC-4 commit-integrity vectors
vectors:
  - id: CT-R4-001
    rfc: RFC-4 §1
    category: commit
    property: Valid Grant Binding
    input: Matching evaluation_id, action, nonce within window
    intended: GRANT / COMMITTED
    expected: GRANT
    status: implemented
    native: PASS
    observed: bound and committed (native)
    reference: RFC-4 §1

  - id: CT-R4-002
    rfc: RFC-4 §1.3
    category: commit
    property: Action / Payload Binding Violation
    input: Grant for action_A; commit attempts action_B
    intended: REJECT / PAYLOAD_BINDING_VIOLATION
    expected: REJECT
    status: implemented
    native: PASS
    observed: PAYLOAD_BINDING_VIOLATION raised (native)
    reference: RFC-4 §1.3

  - id: CT-R4-003
    rfc: RFC-4 §2.1
    category: commit
    property: Replay Rejection
    input: Consumed nonce reused
    intended: REJECT / REPLAY_DETECTED
    expected: REJECT
    status: implemented
    native: PASS
    observed: REPLAY_DETECTED (native)
    reference: RFC-4 §2.1

  - id: CT-R4-004
    rfc: RFC-4 §2
    category: commit
    property: Expired Grant Rejection
    input: valid_until passed before commit
    intended: REJECT / EVALUATION_EXPIRED
    expected: REJECT
    status: implemented
    native: PASS
    observed: EVALUATION_EXPIRED (native)
    reference: RFC-4 §2

  - id: CT-R4-005
    rfc: RFC-4 §2.2
    category: commit
    property: Commit-State Binding / Race Detection
    input: policy_epoch changed between verdict and commit
    intended: HARD_VETO / STATE_DRIFT; commit blocked
    expected: HARD_VETO
    status: implemented
    native: FAIL
    observed: STATE_DRIFT (epoch 0→1) (native)
    reference: RFC-4 §2.2

  - id: CT-R4-006
    rfc: RFC-4 §1
    category: commit
    property: Non-PASS Cannot Cross Commit
    input: HOLD or HARD_VETO then commit attempt
    intended: REJECT / INVALID_DISPOSITION
    expected: REJECT
    status: implemented
    native: PASS
    observed: HARD_VETO blocked at commit gate (native)
    reference: RFC-4 §1

  - id: CT-R4-007
    rfc: RFC-4 §3
    category: commit
    property: Decision Receipt Generation
    input: Every disposition generates a signed Receipt
    intended: Signed Receipt, independently verifiable
    expected: signed receipt
    status: implemented
    native: PASS
    observed: Ed25519 verified (native)
    reference: RFC-4 §3

  - id: CT-R4-008
    rfc: RFC-4 §4
    category: commit
    property: Evidence Manifest Integrity
    input: Append-only hash-chain manifest
    intended: Integrity verifiable at any time
    expected: integrity verifiable
    status: implemented
    native: PASS
    observed: Hash-chain intact (native, len=13)
    reference: RFC-4 §4

  - id: CT-R4-009
    rfc: RFC-4 §4
    category: commit
    property: Independent Evidence Verification
    input: Third-party verifier reproduces decision from manifest
    intended: Decision reproducible from Manifest
    expected: independently verifiable
    status: implemented
    native: IMPLEMENTATION_GAP
    observed: "Signature verification alone does not reproduce the decision."
    reference: RFC-4 §4.3

  - id: CT-R4-010
    rfc: RFC-4 §1.1
    category: commit
    property: External-Effect Claim Boundary
    input: Non-atomic external effects
    intended: Declared non-atomic; post-commit evidence required
    expected: declared
    status: implemented
    native: IMPLEMENTATION_GAP
    observed: "Declaration present; no evidence of external effect."
    reference: RFC-4 §1.1
