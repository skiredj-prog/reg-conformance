meta:
  name: commit
  version: 1.0.0
  description: RFC-4 commit-integrity vectors
vectors:
  - id: CT-R4-001
    rfc: RFC-4 §1
    category: commit
    property: Valid Grant Binding
    input: Matching evaluation_id, action, nonce within window
    intended: GRANT / COMMITTED
    expected: GRANT
    status: implemented
    native: PASS
    observed: bound and committed (native)
    reference: RFC-4 §1

  - id: CT-R4-002
    rfc: RFC-4 §1.3
    category: commit
    property: Action / Payload Binding Violation
    input: Grant for action_A; commit attempts action_B
    intended: REJECT / PAYLOAD_BINDING_VIOLATION
    expected: REJECT
    status: implemented
    native: PASS
    observed: PAYLOAD_BINDING_VIOLATION raised (native)
    reference: RFC-4 §1.3

  - id: CT-R4-003
    rfc: RFC-4 §2.1
    category: commit
    property: Replay Rejection
    input: Consumed nonce reused
    intended: REJECT / REPLAY_DETECTED
    expected: REJECT
    status: implemented
    native: PASS
    observed: REPLAY_DETECTED (native)
    reference: RFC-4 §2.1

  - id: CT-R4-004
    rfc: RFC-4 §2
    category: commit
    property: Expired Grant Rejection
    input: valid_until passed before commit
    intended: REJECT / EVALUATION_EXPIRED
    expected: REJECT
    status: implemented
    native: PASS
    observed: EVALUATION_EXPIRED (native)
    reference: RFC-4 v0.2 §5.2 item 4; superseded per RFC-4 v0.3 revision (2026-11-19) §5, kept with its text and results
    superseded_by: [CT-R4-004a, CT-R4-004b]


  - id: CT-R4-004a
    rfc: RFC-4 v0.3 revision §2.1
    category: commit
    property: Authority Valid at the Time of the Effect
    input: Commit under an authorization whose declared bound has passed
    intended: No effect attributed to the expired authorization; any refusal mechanism satisfies the clause. A fresh authorization is a declared policy, attributed to the new authorization with its own identity and evidence.
    expected: no effect under the expired authorization
    status: implemented
    native: PASS
    observed: "commit refused under the expired authorization (EVALUATION_EXPIRED) (native)"
    reference: RFC-4 v0.3 revision (ratified 2026-11-19) §2.1, §5

  - id: CT-R4-004b
    rfc: RFC-4 v0.3 revision §2.2, §2.3; RFC-0 §6; REG-STATE-024
    category: commit
    property: Held Attempt at Its Declared Bound
    input: Held attempt (HOLD, escalation) left past its declared bound, then an advance under the same attempt identity
    intended: Pre-declared disposition, refusal by default, terminal for that attempt identity; recorded with the bound, the disposition and the resulting state as the available evidence establishes it (CONFIRMED_NONEXECUTION if never dispatched, if a qualified rejection of the dispatch was observed, or if a qualified, verified non-execution attestation exists; otherwise UNKNOWN with reconciliation)
    expected: no effect under that attempt identity; terminal refusal recorded
    status: specified
    native: ADAPTER_REQUIRED
    observed: "The bundled kernel declares no bound on a held attempt (its only HOLD is insufficient evidence)."
    reference: RFC-4 v0.3 revision (ratified 2026-11-19) §2.2, §2.3, §5; RFC-5 §2
  - id: CT-R4-005
    rfc: RFC-4 §2.2
    category: commit
    property: Commit-State Binding / Race Detection
    input: policy_epoch changed between verdict and commit
    intended: No effect under the changed state; terminal refusal, or suspension with a declared resumption condition
    expected: no effect; terminal refusal, or suspension with a declared resumption condition
    status: implemented
    native: PASS
    observed: "STATE_DRIFT produced HARD_VETO (epoch 0→1) (native)"
    reference: RFC-4 §2.2; RN-001 §4

  - id: CT-R4-006
    rfc: RFC-4 §1
    category: commit
    property: Non-PASS Cannot Cross Commit
    input: HOLD or HARD_VETO then commit attempt
    intended: REJECT / INVALID_DISPOSITION
    expected: REJECT
    status: implemented
    native: PASS
    observed: HARD_VETO blocked at commit gate (native)
    reference: RFC-4 §1

  - id: CT-R4-007
    rfc: RFC-4 §3
    category: commit
    property: Decision Receipt Generation
    input: Every disposition generates a signed Receipt
    intended: Signed Receipt, independently verifiable
    expected: signed receipt
    status: implemented
    native: PASS
    observed: Ed25519 verified (native)
    reference: RFC-4 §3

  - id: CT-R4-008
    rfc: RFC-4 §4
    category: commit
    property: Evidence Manifest Integrity
    input: Append-only hash-chain manifest
    intended: Integrity verifiable at any time
    expected: integrity verifiable
    status: implemented
    native: PASS
    observed: Hash-chain intact (native, len=13)
    reference: RFC-4 §4

  - id: CT-R4-009
    rfc: RFC-4 §4
    category: commit
    property: Independent Evidence Verification
    input: Third-party verifier reproduces decision from manifest
    intended: Decision reproducible from Manifest
    expected: independently verifiable
    status: specified
    native: IMPLEMENTATION_GAP
    observed: "Signature verification alone does not reproduce the decision."
    reference: RFC-4 §4.3

  - id: CT-R4-010
    rfc: RFC-4 §1.1
    category: commit
    property: External-Effect Claim Boundary
    input: Non-atomic external effects
    intended: Declared non-atomic; post-commit evidence required
    expected: declared
    status: specified
    native: IMPLEMENTATION_GAP
    observed: "Declaration present; no evidence of external effect."
    reference: RFC-4 §1.1

  - id: CT-R4-014
    rfc: RFC-4 §1.1, §5.2; RN-001 §3
    category: commit
    property: No Dispatch on a Stale Verdict
    input: Verdict older than the policy's freshness threshold reaches commit
    intended: No effect without a fresh adjudication that includes the verdict's age
    expected: no effect, or a fresh adjudication that includes the verdict's age
    status: specified
    native: NOT_SPECIFIED
    observed: "Not exercised yet. CT-R4-004 covers the refusal branch only."
    reference: withdrawn reading, RFC-4 v0.3 revision §4; was RN-001 §3.1
    superseded_by: [CT-R4-004a]

  - id: CT-R4-015
    rfc: RFC-2 §3.4; RN-001 §3
    category: commit
    property: Age Never Improves a Disposition
    input: Same inputs readjudicated with a greater verdict age
    intended: Disposition no less restrictive than at the lesser age
    expected: disposition at the greater age is equal or more restrictive
    status: specified
    native: NOT_SPECIFIED
    observed: "Not exercised yet; needs a readjudication entry point."
    reference: withdrawn reading, RFC-4 v0.3 revision §4; was RFC-2 §3.4 (one-way hardening) applied to verdict age; RN-001 §3.2
    superseded_by: [CT-R4-004a]

  - id: CT-R4-016
    rfc: RFC-5 §2; RFC-0 §6; RN-001 §2a, §3
    category: commit
    property: Fail-Safe Bound Refuses Alone
    input: A bound the policy declares fail-safe (e.g. τ_K on a HOLD) is exhausted, all other inputs favourable
    intended: Pre-declared exhaustion policy applied wherever the held operation could advance
    expected: no effect; exhaustion policy applied without a timer
    status: specified
    native: NOT_SPECIFIED
    observed: "Not exercised yet; needs a policy-declared fail-safe bound in the subject."
    reference: merged into CT-R4-004b, RFC-4 v0.3 revision §4; was RFC-5 §2 (pre-declared exhaustion policy); RN-001 §2a, §3.3
    superseded_by: [CT-R4-004b]
